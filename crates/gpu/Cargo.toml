[package]
name = "photosplice-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
half = "2"
photosplice-geom = { workspace = true }
photosplice-color = { workspace = true }
photosplice-raster = { workspace = true }
photosplice-doc = { workspace = true }
photosplice-compose = { workspace = true }
# Same major version as eframe's wgpu so the app's device can be shared.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Effect distance fields are computed in parallel bands.
rayon = { workspace = true }

[dev-dependencies]
wgpu = { version = "30" }
pollster = "1"
# Shape layers in the effect parity tests.
photosplice-vector = { workspace = true }
