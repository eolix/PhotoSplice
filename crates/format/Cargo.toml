[package]
name = "photosplice-format"
description = "Native .pcraft document bundle: manifest + content-addressed zstd tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photosplice-geom = { workspace = true }
photosplice-color = { workspace = true }
photosplice-raster = { workspace = true }
photosplice-doc = { workspace = true }
photosplice-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
flate2 = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
ruzstd = "0.9"

[dev-dependencies]
proptest = { workspace = true }
