[package]
name = "photosplice-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
photosplice-geom = { workspace = true }
photosplice-color = { workspace = true }
photosplice-cms = { workspace = true }
photosplice-raster = { workspace = true }
photosplice-doc = { workspace = true }
photosplice-ops = { workspace = true }
photosplice-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
photosplice-paint = { workspace = true }
photosplice-algo = { workspace = true }
photosplice-text = { workspace = true }
photosplice-vector = { workspace = true }
photosplice-io = { workspace = true }
photosplice-psd = { workspace = true }
photosplice-format = { workspace = true }
photosplice-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
photosplice-codecs = { workspace = true }
flate2 = { workspace = true }
craft-print = { workspace = true }

# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through photosplice-ui-egui and usvg.
roxmltree = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
photosplice-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
photosplice-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
