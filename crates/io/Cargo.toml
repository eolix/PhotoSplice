[package]
name = "photosplice-io"
description = "Import/export between photosplice documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
photosplice-geom = { workspace = true }
photosplice-color = { workspace = true }
photosplice-cms = { workspace = true }
photosplice-raster = { workspace = true }
photosplice-doc = { workspace = true }
photosplice-compose = { workspace = true }
photosplice-psd = { workspace = true }
photosplice-codecs = { workspace = true }
# PDF pages (pure Rust, Apache-2.0 OR MIT): hayro-interpret walks a page's operations into the
# importer's device; hayro's renderer is vendored in src/pdf/render and needs the rest.
hayro = "0.8"
fearless_simd = "1"
pic-scale = { version = "0.7", default-features = false }
rustc-hash = "2"
bytemuck = { workspace = true }
image = { workspace = true, features = ["png"] }
# Layered PDF output (pure Rust, MIT OR Apache-2.0): paths, text in embedded subset fonts, images,
# transparency groups. No text shaping of its own (ours is used).
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# The Photoshop editing data added to a saved PDF (Flate streams).
flate2 = { workspace = true }
# EXIF (camera, lens, exposure) read from and written for camera raw files.
photosplice-algo = { workspace = true }
photosplice-raw = { workspace = true }
photosplice-text = { workspace = true }
photosplice-paint = { workspace = true }
photosplice-vector = { workspace = true }
photosplice-format = { path = "../format" }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[dev-dependencies]
photosplice-psd = { workspace = true, features = ["testgen"] }
photosplice-raw = { workspace = true, features = ["testgen"] }
proptest = { workspace = true }
# examples/gpu_diff.rs: the GPU compositor (what the app draws) against Photoshop's composite.
photosplice-gpu = { path = "../gpu" }
wgpu = { version = "30" }
pollster = "1"
