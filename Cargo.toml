[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/photosplice", "xtask"]

[workspace.package]
version = "0.9.26"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# internal
photosplice-geom = { path = "crates/geom" }
photosplice-color = { path = "crates/color" }
photosplice-cms = { path = "crates/cms" }
photosplice-raster = { path = "crates/raster" }
photosplice-doc = { path = "crates/doc" }
photosplice-ops = { path = "crates/ops" }
photosplice-psd = { path = "crates/psd" }
photosplice-codecs = { path = "crates/codecs" }
photosplice-raw = { path = "crates/raw" }
photosplice-affinity = { path = "crates/affinity" }
photosplice-compose = { path = "crates/compose" }
photosplice-gpu = { path = "crates/gpu" }
photosplice-paint = { path = "crates/paint" }
photosplice-algo = { path = "crates/algo" }
photosplice-io = { path = "crates/io" }
photosplice-text = { path = "crates/text" }
photosplice-vector = { path = "crates/vector" }
photosplice-format = { path = "crates/format" }
photosplice-automation = { path = "crates/automation" }
photosplice-plugins = { path = "crates/plugins" }
photosplice-engine = { path = "crates/engine" }
photosplice-ui-egui = { path = "crates/ui-egui" }
photosplice-testkit = { path = "crates/testkit" }
photosplice-tablet = { path = "crates/tablet" }

# external
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs; the web build's size gate).
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the ~260 test binaries (#2204). CI sets the same through
# CARGO_PROFILE_DEV_DEBUG (and no debuginfo at all for the Windows tests). To inspect locals in a
# debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.photosplice-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# Interactive development profile (macOS quick loop: `cargo dev`, scripts/dev-macos.sh).
#
# `--release` links with thin LTO and one codegen unit, which is slow to rebuild, and it
# compiles out `debug_assertions` — which is what gates the PHOTOSPLICE_THEME_FILE live
# design-token overrides in `crates/ui-egui/src/theme.rs`. This profile keeps the dev family's
# debug assertions and incremental compilation, and buys back interactive speed by optimising
# dependencies and the pixel crates instead of using LTO.
[profile.devfast]
inherits = "dev"
opt-level = 2
# Line tables only: enough for a usable backtrace, much faster to link than full debuginfo.
debug = 1
# Incremental codegen at opt-level 2 emits CGU-local `.llvm.*` symbols that the final link
# cannot resolve across crates on macOS, so the binary fails to link. Full codegen units are
# the cost of this profile being usable at all.
incremental = false

# Per-package overrides are per-profile and are not inherited, so they are repeated here.
[profile.devfast.package."*"]
opt-level = 2

# The pixel path stays at opt-level 3.
[profile.devfast.package.photosplice-raster]
opt-level = 3
[profile.devfast.package.photosplice-color]
opt-level = 3
[profile.devfast.package.photosplice-cms]
opt-level = 3
[profile.devfast.package.photosplice-compose]
opt-level = 3
[profile.devfast.package.photosplice-algo]
opt-level = 3
[profile.devfast.package.photosplice-paint]
opt-level = 3

# The browser build (apps/photosplice-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for PhotoSplice's own crates,
# "s" for dependencies and for the crates that decode files, and 3 for pixel processing (filters
# and compositing). Dependencies stay at "s": at "z" the whole wasm grows (by 0.4 MB, measured).
# panic stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"`
# is for the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Decoding and rasterizing keep their speed.
[profile.wasm-release.package.photosplice-codecs]
opt-level = "s"
[profile.wasm-release.package.photosplice-raw]
opt-level = "s"
[profile.wasm-release.package.photosplice-vector]
opt-level = "s"

# Large crates off the per-frame and per-pixel paths: the document model, file parsers run once
# per open/save, JSON (settings, presets, control channel), SVG parsing, and shader translation
# (runs when a pipeline is created). "z" keeps the wasm well under the size gate.
[profile.wasm-release.package.photosplice-doc]
opt-level = "z"
[profile.wasm-release.package.photosplice-psd]
opt-level = "z"
[profile.wasm-release.package.photosplice-format]
opt-level = "z"
[profile.wasm-release.package.photosplice-affinity]
opt-level = "z"
[profile.wasm-release.package.serde_json]
opt-level = "z"
[profile.wasm-release.package.usvg]
opt-level = "z"
[profile.wasm-release.package.naga]
opt-level = "z"

# Pixel processing keeps its speed-oriented optimization level, with two exceptions.
# Colour-management transforms are built once and cached (`transform::cached`), so "z" costs
# little runtime. The browser app composites per frame on the GPU (`crates/gpu`, WebGPU/WebGL2),
# so the CPU compositor is not the browser's hot path there; "z" for compose keeps the wasm
# under the 24 MiB gate (measured −122 KB vs opt-level 3). algo's filters run per pixel on
# every interactive filter application; "z" there is the size lever of last resort (−331 KB),
# taken because the gate is enforced in CI: if browser filters feel too slow, restore 3 here
# and reclaim the bytes from a feature-gated decoder instead.
[profile.wasm-release.package.photosplice-raster]
opt-level = 3
[profile.wasm-release.package.photosplice-color]
opt-level = 3
[profile.wasm-release.package.photosplice-cms]
opt-level = "z"
[profile.wasm-release.package.photosplice-compose]
opt-level = "z"
[profile.wasm-release.package.photosplice-algo]
opt-level = "z"
[profile.wasm-release.package.photosplice-paint]
opt-level = 3

